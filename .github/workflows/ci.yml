name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  host-tests:
    name: Host tests and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install host test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep shellcheck

      - name: Check shell scripts
        run: shellcheck tools/*.sh

      - name: Run host test suite
        run: tools/test-host.sh

  android:
    name: Android companion
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install qualified Android SDK packages
        run: >-
          "${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Test and build Android companion
        env:
          ZECTRIX_ANDROID_CLEAN: "1"
        run: tools/test-android-companion.sh

      - name: Upload Android test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-report
          path: android-companion/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-debug-apk
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  firmware:
    name: ESP32-S3 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare ccache directory
        run: mkdir -p "${{ runner.temp }}/ccache"

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: >-
            ${{ runner.os }}-esp-idf-v5.5.2-${{
            hashFiles('**/CMakeLists.txt', 'dependencies.lock',
            'main/idf_component.yml', 'sdkconfig.defaults', 'partitions.csv') }}
          restore-keys: |
            ${{ runner.os }}-esp-idf-v5.5.2-

      - name: Build firmware and capture provenance
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          extra_docker_args: >-
            -v ${{ runner.temp }}/ccache:/root/.ccache
            -e CCACHE_DIR=/root/.ccache
          command: >-
            apt-get update &&
            apt-get install --yes --no-install-recommends jq &&
            tools/build-firmware.sh --clean &&
            idf.py size > build/size-report.txt &&
            cat build/size-report.txt &&
            tools/capture-build-provenance.sh

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: esp32s3-firmware
          path: |
            build/**/*.bin
            build/*.elf
            build/*.map
            build/build-provenance.txt
            build/size-report.txt
          if-no-files-found: error
          retention-days: 14
